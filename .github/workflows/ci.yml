# =======================================================================================================
# Build AJB and publish tags from master.
# =======================================================================================================

name: Build and release

on:
  push:
    branches: [master]
    tags: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    if: github.event.deleted != true
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require tag commit on master
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor HEAD origin/master

      - name: Set up SourcePawn
        uses: rumblefrog/setup-sp@master
        with:
          version: '1.12.x'
          github-token: ${{ github.token }}

      - name: Build release package
        run: ./build.ps1 -ScriptingPath $env:scriptingPath -Package

      - uses: actions/upload-artifact@v7
        with:
          name: ajb-package
          path: dist/ajb.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag' && github.event.created
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ajb-package
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/ajb.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
