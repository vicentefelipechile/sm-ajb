// =========================================================================================================
// AJB — Warden menu layout (configs/ajb/warden_menu.cfg)
// =========================================================================================================
// The warden menu is drawn exactly as described here; the file is hot-reloadable
// with sm_ajb_menu_reload (and reloads on every map start).
//
//   "WardenMenu"
//   {
//       "Page name"                    // first-level keys = menu pages (name shown as header)
//       {
//           "--- Section ---"  ""      // empty value = un-numbered text line (free slot)
//           "Abrir celdas"     "sm_ajb_open"    // any other value = console command run as the warden
//           "Siguiente »"      "sm_ajb_menu_next"
//       }
//   }
//
// - A page holds at most 9 numbered items (TF2 panel keys 1-9); text lines are free.
//   Extra numbered items are dropped (see the server log). Exit is always key 0/10.
// - With more than one page, a separator + "Prev/Next" row is appended automatically
//   (translated). No nav entries needed — but if a page defines sm_ajb_menu_next or
//   sm_ajb_menu_prev itself, the automatic one is skipped for that direction.
// - Labels prefixed with "phrase:" are looked up in translations/ajb.phrases.txt.
// - Deleting this file restores the built-in two-page menu (identical layout to this one).
// - After a command runs the menu reopens, except for commands that open their own
//   panel/page: sm_ajb_lr, sm_ajb_uw, sm_ajb_vote_yesno, sm_ajb_vote_multi,
//   sm_ajb_warden_markrebel, sm_ajb_warden_pardonrebel, sm_ajb_menu_next, sm_ajb_menu_prev.
//
// All built-in actions:
//   sm_ajb_open / sm_ajb_close        open/close cells (warden or admin)
//   sm_ajb_marker                     place the 'come here' marker
//   sm_ajb_collisions                 toggle teammate push
//   sm_ajb_friendlyfire               toggle friendly fire
//   sm_ajb_uw                         resign warden (confirmation)
//   sm_ajb_lr                         grant Last Request to a prisoner
//   sm_ajb_vote_yesno / sm_ajb_vote_multi   warden votes
//   sm_ajb_warden_markrebel / sm_ajb_warden_pardonrebel   rebel pick lists
//   sm_ajb_menu_next / sm_ajb_menu_prev    page navigation (auto-added; optional here)
// =========================================================================================================

"WardenMenu"
{
	"phrase:Warden Menu Title Shortcuts"
	{
		"phrase:Warden Header Cells"           ""
		"phrase:Warden Menu Open Cells"        "sm_ajb_open"
		"phrase:Warden Menu Close Cells"       "sm_ajb_close"
		"phrase:Warden Header Tools"           ""
		"phrase:Warden Menu Marker"            "sm_ajb_marker"
		"phrase:Warden Menu Collisions Enable" "sm_ajb_collisions"
		"phrase:Warden Menu FriendlyFire Enable" "sm_ajb_friendlyfire"
		"phrase:Warden Header Manage"          ""
		"phrase:Warden Menu Resign"            "sm_ajb_uw"
	}
	"phrase:Warden Menu Title Events"
	{
		"phrase:Warden Header Events"          ""
		"phrase:Warden Menu Give LR"           "sm_ajb_lr"
		"phrase:Warden Menu Vote YesNo"        "sm_ajb_vote_yesno"
		"phrase:Warden Menu Vote Multi"        "sm_ajb_vote_multi"
		"phrase:Warden Header Rebels"          ""
		"phrase:Warden Menu Mark Rebel"        "sm_ajb_warden_markrebel"
		"phrase:Warden Menu Pardon Rebel"      "sm_ajb_warden_pardonrebel"
	}
}
